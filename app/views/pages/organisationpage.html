<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <title>Page d'organisation du scrutin</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <div class="organisationcontainer">
            <div class="topbar">
                <a class="backbtn" href="{{ url_for('main.homepage') }}">Déconnexion</a>
                <img class="logovoteapp" src="../static/media/logovote.jpg" alt="image d'une main plaçant un vote dans une urne">
            </div>
            <h1 class="logintitle1">Espace organisateur</h1>
            <p class="logintxt1">Gérez vos scrutins et suivez leur état d'avancement</p>
            <a href="{{ url_for('main.creationscrutin') }}"><button class="buttonpasskey">➕ Créer un nouveau scrutin</button></a>

            <div class="listescrutins">
                {% for i in scrutins %}
                    <a class="scrutins" href="{{ url_for('main.detailscrutin')}}"></a>
                {% else %}
                    <a class="scrutins" href="{{ url_for('main.detailscrutin')}}">
                        <h3 class="titre-scrutin">Test</h3>
                        <p class="date-scrutin">Test</p>
                        <span class="inscrits-scrutin">Test</span>
                    </a>
                    <p>Aucun scrutin pour le moment</p>
                {% endfor %}
            </div>
        </div>
    </body>
</html>
