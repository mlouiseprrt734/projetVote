<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <title>Page d'organisation du scrutin</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <div class="organisationcontainer">
            <div class="topbar">
                <a class="backbtn" href="{{ url_for('main.detailscrutin') }}">← Retour</a>
                <img class="logovoteapp" src="../static/media/logovote.jpg" alt="image d'une main plaçant un vote dans une urne">
            </div>
            <div class="topbar">
                <button class="btnsave">Enregistrer</button>
                <h1 class="logintitle1">Paramètres</h1>
            </div>
            <h4>Informations générales</h4>
            <form action="#" method="post">
            <div>
                <label for="titre">Titre du scrutin *</label>
                <input type="text" id="titre" name="titre" required>
            </div>

            <div>
                <label for="description">Description</label>
                <textarea id="description" name="description"></textarea>
            </div>

            <h4>Dates</h4>
            <div>
                <label for="date-debut">Date de début *</label>
                <input type="date" id="date-debut" name="date_debut">
            </div>

            <div>
                <label for="date-fin">Date de fin *</label>
                <input type="date" id="date-fin" name="date_fin">
            </div>

            <h4>Lieu de vote</h4>
            <div>
                <select id="lieu" name="lieu">
                    <option value="">Choisir un lieu</option>
                </select>
            </div>

            </form>
        </div>
    </body>
</html>
