<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <title>Page d'organisation du scrutin</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <div class="organisationcontainer">
            <div class="topbar">
                <a class="backbtn" href="{{ url_for('main.detailscrutin', idscrutin=scrutin.idscrutin) }}">← Retour</a>
                <img class="logovoteapp" src="../static/media/logovote.jpg" alt="image d'une main plaçant un vote dans une urne">
            </div>
            <div class="topbar">
                <button class="btnsave" type="submit" form="formscrutin">Enregistrer</button>
                <h1 class="logintitle1">Paramètres</h1>
            </div>
            <form action="{{ url_for('main.parametrescrutin', idscrutin=scrutin.idscrutin) }}" method="post" class="formscrutin" id="formscrutin">
                <h4>Informations générales</h4>
                <div>
                    <label for="type" class="formtxt">Nom du scrutin <span class="obligatoire">*</span></label>
                    <input type="text" id="type" name="type" value="{{ scrutin.type }}" required>
                </div>

                <h4>Dates</h4>
                {% if erreur %}
                    <p style="color: red; font-weight: 500; font-size: 10px;">Erreur : {{ erreur }}</p>
                {% endif %}
                <div class="dates">
                    <div>
                        <label for="dateouverture" class="formtxt">Date de début <span class="obligatoire">*</span></label>
                        <input type="date" id="dateouverture" name="dateouverture" value="{{ scrutin.dateouverture }}" required>
                    </div>
                    <div>
                        <label for="datecloture" class="formtxt">Date de fin <span class="obligatoire">*</span></label>
                        <input type="date" id="datecloture" name="datecloture" value="{{ scrutin.datecloture }}" required>
                    </div>
                </div>

                <h4>Statut du vote</h4>
                <div>
                    <select id="statut" name="statut" class="select-statut {% if scrutin.statut == 'En cours' %}statut-encours{% else %}statut-termine{% endif %}">
                        <option value="En cours" {% if scrutin.statut == 'En cours' %}selected{% endif %}>En cours</option>
                        <option value="Terminé" {% if scrutin.statut == 'Terminé' %}selected{% endif %}>Terminé</option>
                    </select>
                </div>
            </form>
        </div>
    </body>
</html>
