<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <title>Page d'organisation du scrutin</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <div class="organisationcontainer">
            <div class="topbar">
                <a class="backbtn" href="{{ url_for('main.organisationpage') }}">← Retour</a>
                <img class="logovoteapp" src="../static/media/logovote.jpg" alt="image d'une main plaçant un vote dans une urne">
            </div>
            <div class="topbar">
                <button class="btnsave" type="submit" form="formscrutin">Enregistrer</button>
                <h1 class="logintitle1">Paramètres</h1>
            </div>
            <form action="#" method="post" class="formscrutin" id="formscrutin">
                <h4>Informations générales</h4>
                <div>
                    <label for="titre" class="formtxt">Titre du scrutin <span class="obligatoire">*</span></label>
                    <input type="text" id="titre" name="titre" required>
                </div>

                <div>
                    <label for="description" class="formtxt">Description</label>
                    <textarea id="description" name="description"></textarea>
                </div>

                <h4>Dates</h4>
                <div class="dates">
                    <div>
                        <label for="date-debut" class="formtxt">Date de début <span class="obligatoire">*</span></label>
                        <input type="date" id="date-debut" name="date_debut" required>
                    </div>

                    <div>
                        <label for="date-fin" class="formtxt">Date de fin <span class="obligatoire">*</span></label>
                        <input type="date" id="date-fin" name="date_fin" required>
                    </div>
                </div>

                <h4>Lieu de vote</h4>
                <div>
                    <select id="lieu" class="formtxt" name="lieu">
                        <option value="">Choisir un lieu</option>
                    </select>
                </div>
            </form>
        </div>
    </body>
</html>
