<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <title>Page d'organisation du scrutin</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <div class="organisationcontainer">
            <div class="topbar">
                <a class="backbtn" href="{{ url_for('main.organisationpage') }}">← Retour</a>
                <img class="logovoteapp" src="../static/media/logovote.jpg" alt="image d'une main plaçant un vote dans une urne">
            </div>
            <h1 class="logintitle1">Nom scrutin</h1>
            <a class="detailscrutins">
                <p class="date-scrutin"><img src="../../static/media/calendrier.png">Date</p>
                <p class="date-scrutin"><img src="../../static/media/gps.png">Lieu</p>
                <p class="date-scrutin"><img src="../../static/media/document.png">Listes</p>
                <p class="date-scrutin"><img src="../../static/media/silhouette.png">Nb electeurs</p>
            </a>
            <div class="btn-scrutin">
                <a><img src="../../static/media/silhouette.png" style="background-color: #72def7;">Gérer les listes</a>
                <hr>
                <a><img src="../../static/media/silhouette.png" style="background-color: #72f78b;">Gérer les électeurs</a>
                <hr>
                <a><img src="../../static/media/results.png" style="background-color: #fc931c;">Voir les résultats en temps réel</a>
                <hr>
                <a href="{{ url_for('main.parametrescrutin') }}"><img src="../../static/media/rouedentee.png" style="background-color: #72f78b;">Modifier les paramètres</a>
            </div>
        </div>
    </body>
</html>
